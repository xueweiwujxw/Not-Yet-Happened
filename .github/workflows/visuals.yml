name: Render chapter previews

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visuals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: false
      - name: Install software rendering dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 ffmpeg
      - name: Import project
        run: bash scripts/check-godot.sh godot --headless --path . --import
      - name: Render actual Godot scene with Mesa OpenGL
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s '-screen 0 1600x1000x24' bash scripts/check-godot.sh godot --path . --rendering-method gl_compatibility --audio-driver Dummy --script tests/render_kitchen.gd
      - uses: actions/upload-artifact@v4
        with:
          name: kitchen-previews
          path: build/previews/kitchen-*.png
          if-no-files-found: error
          retention-days: 14
      - name: Render keeper office with Mesa OpenGL
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s '-screen 0 1280x720x24' bash scripts/check-godot.sh godot --path . --rendering-method gl_compatibility --audio-driver Dummy --script tests/render_keeper.gd
      - uses: actions/upload-artifact@v4
        with:
          name: keeper-previews
          path: build/previews/keeper-*.png
          if-no-files-found: error
          retention-days: 14
      - name: Render chapters three through six with Mesa OpenGL
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s '-screen 0 1280x720x24' bash scripts/check-godot.sh godot --path . --rendering-method gl_compatibility --audio-driver Dummy --script tests/render_finale.gd
      - uses: actions/upload-artifact@v4
        with:
          name: finale-previews
          path: build/previews/finale-*.png
          if-no-files-found: error
          retention-days: 14
      - name: Record real camera and movement reel
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a -s '-screen 0 1280x720x24' bash scripts/check-godot.sh godot --path . --rendering-method gl_compatibility --audio-driver Dummy --fixed-fps 30 --write-movie build/previews/cinematic.avi --script tests/render_cinematic.gd
          ffmpeg -y -i build/previews/cinematic.avi -c:v libx264 -pix_fmt yuv420p -crf 22 -c:a aac -b:a 128k build/previews/cinematic.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: cinematic-preview
          path: |
            build/previews/cinematic-*.png
            build/previews/cinematic.mp4
          if-no-files-found: error
          retention-days: 14
